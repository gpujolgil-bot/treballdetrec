<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tribunals del Treball de Recerca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-css">/* Eina de gestió: registre d'acta. Tinta blava-pissarra sobre paper fred, accent verd ampolla,
   capçalera fixa amb resum, pestanyes, i files-fitxa per treball amb franja d'estat a l'esquerra. */
:root {
  --paper: #f4f5f3;
  --surface: #ffffff;
  --ink: #1c2733;
  --muted: #5d6874;
  --line: #d9ddd8;
  --accent: #17695a;
  --accent-soft: #dcece7;
  --ok: #2f7d4f; --warn: #a86a00; --crit: #b3261e; --info: #4a5d75;
  --warn-soft: #fbeed2; --crit-soft: #f8dcd9; --ok-soft: #dcefe2;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --chip-l: 92%; --chip-tl: 26%; --chip-s: 50%;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12181e; --surface: #1a222a; --ink: #e4e9ee; --muted: #9aa6b2; --line: #2e3a45;
    --accent: #4fb9a2; --accent-soft: #1d3b35;
    --ok: #6cc28c; --warn: #e0a640; --crit: #f08a80; --info: #9db1c9;
    --warn-soft: #3a2e14; --crit-soft: #3d1f1c; --ok-soft: #1c3526;
    --chip-l: 24%; --chip-tl: 84%; --chip-s: 35%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12181e; --surface: #1a222a; --ink: #e4e9ee; --muted: #9aa6b2; --line: #2e3a45;
  --accent: #4fb9a2; --accent-soft: #1d3b35;
  --ok: #6cc28c; --warn: #e0a640; --crit: #f08a80; --info: #9db1c9;
  --warn-soft: #3a2e14; --crit-soft: #3d1f1c; --ok-soft: #1c3526;
  --chip-l: 24%; --chip-tl: 84%; --chip-s: 35%;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 22px; font-weight: 600; letter-spacing: .01em; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
.num, td.n, .tile b { font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1320px; margin: 0 auto; padding: 0 20px; }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-top: 12px; padding-bottom: 10px; }
.top .titol { flex: 1 1 280px; min-width: 0; }
.top .sub { color: var(--muted); font-size: 12.5px; }
.desa { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.estat-desa { font-size: 12.5px; color: var(--muted); }
.estat-desa.brut { color: var(--warn); font-weight: 600; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: var(--radius); cursor: pointer; line-height: 1.3; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.sm { padding: 3px 8px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: transparent; }

nav.tabs { display: flex; gap: 2px; overflow-x: auto; }
nav.tabs a { padding: 8px 14px; color: var(--muted); text-decoration: none; border-bottom: 3px solid transparent; font-weight: 500; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs a .badge { margin-left: 6px; }

.resum { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 16px 0; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.tile span { color: var(--muted); font-size: 12px; }
.tile b { font-family: var(--font-display); font-size: 22px; font-weight: 600; }
.tile small { color: var(--muted); font-size: 12px; }
.tile.crit b { color: var(--crit); } .tile.ok b { color: var(--ok); }

.banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--radius); background: var(--accent-soft); margin: 12px 0 0; }
.banner.warn { background: var(--warn-soft); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 12px; }
.toolbar .sp { flex: 1; }
.toolbar input[type=search], .toolbar select, .field input, .field select { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 6px 8px; }
.toolbar input[type=search] { min-width: 220px; }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }

.chip { --h: 200; display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: hsl(var(--h) var(--chip-s) var(--chip-l)); color: hsl(var(--h) 45% var(--chip-tl)); white-space: nowrap; }
.badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 999px; font-size: 11px; font-weight: 700; text-align: center; background: var(--crit); color: var(--surface); }
.badge.avis { background: var(--warn); }
.pill { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11.5px; font-weight: 600; }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.avis { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--accent-soft); color: var(--info); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }

/* Files de treball */
.llista { display: flex; flex-direction: column; gap: 8px; }
.cap-llista { display: grid; grid-template-columns: var(--cols); gap: 10px; padding: 0 12px 0 16px; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; font-family: var(--font-display); }
.llista, .cap-llista { --cols: minmax(220px, 2.1fr) minmax(130px, 1fr) repeat(3, minmax(160px, 1.15fr)); }
.fila { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--ok); border-radius: var(--radius); padding: 10px 12px; }
.fila.avis { border-left-color: var(--warn); }
.fila.crit { border-left-color: var(--crit); }
.fila.inactiu { border-left-color: var(--line); opacity: .8; }
.fila.flash { box-shadow: 0 0 0 3px var(--accent); }
.fila .g { display: grid; grid-template-columns: var(--cols); gap: 10px; align-items: start; }
.al .nomal { font-weight: 600; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.al .nomal:hover { color: var(--accent); text-decoration: underline; }
.al .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.al .tt { color: var(--muted); font-size: 13px; margin-top: 3px; overflow-wrap: anywhere; }
.grup { font-family: var(--font-mono); font-size: 11.5px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
.tut { font-size: 13px; }
.tut .rol, .seient .rol { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.seient { display: flex; flex-direction: column; gap: 3px; }
.seient .ctl { display: flex; gap: 4px; align-items: stretch; }
.seient select { flex: 1; min-width: 0; border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 5px 6px; font-size: 13px; }
.seient select.t0 { border-left-color: var(--accent); }
.seient select.t1 { border-left-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.seient select.t2 { border-left-color: var(--warn); background: var(--warn-soft); }
.seient select.buit { border-left-color: var(--crit); background: var(--crit-soft); }
.lock { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); width: 30px; display: grid; place-items: center; cursor: pointer; color: var(--muted); padding: 0; }
.lock[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.lock svg { width: 14px; height: 14px; }
.seient .tier { font-size: 11px; color: var(--muted); }
.detall { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 14px; }
.detall .desc { grid-column: 1 / -1; color: var(--muted); max-width: 90ch; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.field input, .field select { color: var(--ink); font-size: 13px; }
.sessio { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.seccio { margin: 22px 0 8px; display: flex; gap: 10px; align-items: baseline; }
.seccio small { color: var(--muted); }

/* Taules */
.taula-w { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-family: var(--font-display); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--paper); position: sticky; top: 0; }
td.n, th.n { text-align: right; }
tr:last-child td { border-bottom: 0; }
tr.grp td { background: var(--paper); font-family: var(--font-display); font-weight: 600; }
.bar { position: relative; height: 8px; background: var(--paper); border-radius: 4px; min-width: 90px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; }
.bar i.tut { background: color-mix(in srgb, var(--accent) 40%, var(--paper)); }
.bar.sobre i { background: var(--warn); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; text-align: left; font-weight: 500; }
.linkbtn:hover { color: var(--accent); text-decoration: underline; }

/* Informes */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.fitxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.fitxa { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.fitxa .tt { font-weight: 600; }
.fitxa dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; font-size: 13px; }
.fitxa dt { color: var(--muted); }
.fitxa dd { margin: 0; }
.prof { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.prof header { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
.prof header small { color: var(--muted); }
.inc { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.inc:last-child { border-bottom: 0; }
.inc .linkbtn { font-weight: 400; }

/* Configuració */
.afi { display: grid; grid-template-columns: 150px 1fr; gap: 8px 12px; align-items: start; }
.afi .opc { display: flex; flex-wrap: wrap; gap: 5px; }
.tog { border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 1px 8px; font-size: 12px; cursor: pointer; color: var(--muted); }
.tog[aria-pressed="true"] { border-style: solid; border-color: transparent; background: hsl(var(--h) var(--chip-s) var(--chip-l)); color: hsl(var(--h) 45% var(--chip-tl)); font-weight: 600; }
.panell { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 12px; }
.panell p { margin: 0; color: var(--muted); max-width: 75ch; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: var(--radius); font-size: 13px; z-index: 50; max-width: calc(100% - 32px); }
.dlg-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: grid; place-items: center; z-index: 60; padding: 16px; }
.dlg { background: var(--surface); border-radius: var(--radius); padding: 18px; max-width: 460px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
.dlg .row { justify-content: flex-end; }
.buit-txt { color: var(--muted); padding: 24px; text-align: center; }
main { padding-bottom: 60px; }

@media (max-width: 960px) {
  .cap-llista { display: none; }
  .fila .g { grid-template-columns: 1fr 1fr; }
  .fila .g .al { grid-column: 1 / -1; }
}
@media (max-width: 520px) {
  .wrap { padding: 0 16px; }
  .fila .g { grid-template-columns: 1fr; }
  .toolbar input[type=search] { min-width: 0; flex: 1 1 100%; }
  .afi { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .fila { transition: box-shadow .3s; }
}

/* Tribunals (fitxa per tribunal) */
.trib { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--ok); border-radius: var(--radius); scroll-margin-top: 130px; }
.trib.avis { border-left-color: var(--warn); }
.trib.crit { border-left-color: var(--crit); }
.trib.flash { box-shadow: 0 0 0 3px var(--accent); }
.trib > header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.trib > header h2 { font-size: 18px; }
.trib > header .meta { display: flex; gap: 5px; flex-wrap: wrap; }
.trib > header .sp { flex: 1; }
.trib > header .lock { height: 30px; }
.trib-cos { display: grid; grid-template-columns: minmax(250px, 320px) 1fr; }
.membres { padding: 12px 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.membres h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.membres ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.membres li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; }
.membres .mnom { font-weight: 600; }
.membres .mrol { flex-basis: 100%; font-size: 12px; color: var(--muted); }
.membres .btn.ghost { padding: 0 4px; font-size: 12px; color: var(--crit); }
.membres select { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 5px 6px; font-size: 13px; }
.defensa { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.defensa .field:last-child { grid-column: 1 / -1; }
.defensa input { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 5px 6px; }
.alumnes { border: 0; border-radius: 0; }
.alumnes td .tt { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.alumnes select { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 4px 6px; font-size: 12.5px; }
.linkpill { border: 0; cursor: pointer; font: inherit; font-size: 11.5px; font-weight: 600; }
table.mini { font-size: 12.5px; }
table.mini th { position: static; }
.llista { gap: 14px; }
@media (max-width: 860px) {
  .trib-cos { grid-template-columns: 1fr; }
  .membres { border-right: 0; border-bottom: 1px solid var(--line); }
}

/* Correus */
.panell textarea, .panell input:not([type=checkbox]):not([type=number]), .correus-g input.mail { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 6px 8px; font: inherit; color: var(--ink); width: 100%; }
.panell textarea { resize: vertical; }
.panell details summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.correus-g { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.correus-g input.mail { min-width: 200px; padding: 4px 6px; font-size: 13px; }
.correus-g input.mail.mal { border-color: var(--crit); background: var(--crit-soft); }
.correus-g tr.sel td { background: var(--accent-soft); }
.previ { position: sticky; top: 140px; max-height: calc(100vh - 160px); overflow: auto; }
.previ .mostra { background: #fff; color: #1c2733; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; overflow-x: auto; }
@media (max-width: 1000px) { .correus-g { grid-template-columns: 1fr; } .previ { position: static; max-height: none; } }
.previ .mostra p { margin: 0 0 10px; color: inherit; max-width: none; }
</style>
</head>

<div id="app"></div>
<script id="estat" type="application/json">{"treballs": [], "teachers": {}, "tribunals": [], "config": {}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script id="app-js">/* ===== Nucli: tribunals de 4 treballs avaluats pels seus tutors (sense DOM) ===== */
const DEPTS = ['Administratiu','Castellà','Català','Educació Física','Experimentals','Expressió','FOL','Idiomes','Informàtica','Matemàtiques','Orientació','PQPI','Sanitàries','Socials','Tecnologia'];
const AFINITATS_DEFECTE = {
  'Experimentals': ['Sanitàries','Matemàtiques','Tecnologia','Educació Física'],
  'Sanitàries': ['Experimentals','Educació Física','Orientació'],
  'Tecnologia': ['Experimentals','Matemàtiques','Informàtica'],
  'Informàtica': ['Tecnologia','Matemàtiques'],
  'Matemàtiques': ['Experimentals','Tecnologia','Informàtica'],
  'Educació Física': ['Experimentals','Sanitàries','Orientació'],
  'Orientació': ['Socials','Experimentals','Sanitàries','Educació Física'],
  'Socials': ['Orientació','Català','Castellà','Administratiu','FOL'],
  'Català': ['Castellà','Idiomes','Socials','Expressió'],
  'Castellà': ['Català','Idiomes','Socials','Expressió'],
  'Idiomes': ['Català','Castellà','Socials'],
  'Expressió': ['Català','Castellà','Socials','Educació Física'],
  'Administratiu': ['Socials','FOL'],
  'FOL': ['Socials','Administratiu','Orientació'],
  'PQPI': ['Orientació','Socials']
};
const COST_TIER = [0, 10, 60];

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function actius(S) { return S.treballs.filter(t => t.estat === 'actiu'); }
function preparat(t) { return t.estat === 'actiu' && t.tutors.length > 0 && !!t.ambit; }
function poolKeys(S) { return Object.keys(S.teachers).filter(k => S.teachers[k].pool); }
function midaT(S) { return S.config.midaTribunal || 4; }
function trib(S, id) { return S.tribunals.find(x => x.id === id); }
function treballsDe(S, tr) { return S.treballs.filter(t => t.tribunal === tr.id && t.estat === 'actiu'); }

/* 0 = mateix departament que l'àmbit, 1 = departament afí, 2 = no afí */
function tier(S, k, ambit) {
  const t = S.teachers[k];
  if (!t || !ambit) return 2;
  if (t.depts.includes(ambit)) return 0;
  const af = S.config.afinitats[ambit] || [];
  return t.depts.some(d => af.includes(d)) ? 1 : 2;
}

function membresTrib(S, tr) {
  const out = [];
  for (const t of treballsDe(S, tr)) for (const k of t.tutors) if (!out.includes(k)) out.push(k);
  for (const k of tr.extra || []) if (!out.includes(k)) out.push(k);
  return out;
}
function rolsTrib(S, tr) {
  const r = {};
  for (const t of treballsDe(S, tr)) for (const k of t.tutors) (r[k] = r[k] || []).push(t);
  return r;
}

/* Per a un treball: qui l'avalua a part del seu tutor i com d'afins són */
function avaluadors(S, t) {
  const tr = t.tribunal && trib(S, t.tribunal);
  if (!tr) return [];
  return membresTrib(S, tr).filter(k => !t.tutors.includes(k)).map(k => ({ k, tier: tier(S, k, t.ambit) }));
}

function ambitPrincipal(S, tr) {
  const c = {};
  for (const t of treballsDe(S, tr)) if (t.ambit) c[t.ambit] = (c[t.ambit] || 0) + 1;
  return Object.keys(c).sort((a, b) => c[b] - c[a] || a.localeCompare(b))[0] || '';
}

function carregues(S) {
  const c = {};
  for (const k of Object.keys(S.teachers)) c[k] = { tutor: 0, tribunals: [], extra: 0 };
  for (const t of actius(S)) for (const k of t.tutors) if (c[k]) c[k].tutor++;
  for (const tr of S.tribunals) {
    for (const k of membresTrib(S, tr)) if (c[k]) c[k].tribunals.push(tr.id);
    for (const k of tr.extra || []) if (c[k]) c[k].extra++;
  }
  return c;
}

/* Cost d'un grup de treballs (llista) com a tribunal, sense membres afegits */
function costGrup(S, ws, mida) {
  const tut = [];
  let cost = 0;
  for (const w of ws) for (const k of w.tutors) tut.push(k);
  const uniq = [...new Set(tut)];
  for (const w of ws) for (const k of uniq) if (!w.tutors.includes(k)) cost += COST_TIER[tier(S, k, w.ambit)];
  cost += (tut.length - uniq.length) * 400;              // mateix tutor dos cops al tribunal
  cost += Math.max(0, mida - uniq.length) * 25;           // caldrà afegir membres
  return cost;
}

function costTotal(S) {
  let c = 0;
  for (const tr of S.tribunals) c += costGrup(S, treballsDe(S, tr), midaT(S));
  return c;
}

/* Proposta: manté els tribunals bloquejats i reparteix la resta de treballs
   en tribunals de mida fixa, minimitzant el cost d'afinitat (recuit simulat). */
function proposa(S, opts) {
  const { seed = Date.now(), iter = 60000, intents = 4 } = opts || {};
  const rand = rng(seed), mida = midaT(S);
  const bloq = S.tribunals.filter(t => t.bloq);
  const lliures = S.treballs.filter(t => preparat(t) && !(t.tribunal && bloq.some(b => b.id === t.tribunal)));
  for (const t of S.treballs) if (!bloq.some(b => b.id === t.tribunal)) t.tribunal = null;
  const vells = S.tribunals.filter(t => !t.bloq);
  S.tribunals = bloq.slice();
  if (!lliures.length) return 0;
  const n = Math.ceil(lliures.length / mida);
  const base = Math.floor(lliures.length / n), resta = lliures.length % n;
  const mides = Array.from({ length: n }, (_, i) => base + (i < resta ? 1 : 0));

  let millor = null, mc = Infinity;
  for (let r = 0; r < intents; r++) {
    // inicial: ordenat per àmbit amb soroll
    const ord = lliures.map(t => ({ t, k: t.ambit + rand() })).sort((a, b) => a.k < b.k ? -1 : 1).map(o => o.t);
    const grups = []; let p = 0;
    for (const m of mides) { grups.push(ord.slice(p, p + m)); p += m; }
    let costs = grups.map(g => costGrup(S, g, mida));
    let total = costs.reduce((a, b) => a + b, 0);
    let T = 40;
    for (let it = 0; it < iter; it++) {
      const a = Math.floor(rand() * n), b = Math.floor(rand() * n);
      if (a === b) continue;
      const i = Math.floor(rand() * grups[a].length), j = Math.floor(rand() * grups[b].length);
      const ga = grups[a].slice(), gb = grups[b].slice();
      const x = ga[i]; ga[i] = gb[j]; gb[j] = x;
      const ca = costGrup(S, ga, mida), cb = costGrup(S, gb, mida);
      const d = ca + cb - costs[a] - costs[b];
      if (d <= 0 || rand() < Math.exp(-d / T)) { grups[a] = ga; grups[b] = gb; costs[a] = ca; costs[b] = cb; total += d; }
      T = Math.max(0.05, T * 0.99985);
    }
    if (total < mc) { mc = total; millor = grups.map(g => g.slice()); }
  }
  // Ordena els tribunals per àmbit perquè la numeració tingui sentit
  const ambG = g => { const c = {}; g.forEach(t => c[t.ambit] = (c[t.ambit] || 0) + 1); return Object.keys(c).sort((a, b) => c[b] - c[a] || a.localeCompare(b))[0]; };
  millor.sort((a, b) => ambG(a).localeCompare(ambG(b), 'ca'));
  const usats = new Set(S.tribunals.map(t => t.num));
  let num = 1;
  millor.forEach((g, idx) => {
    while (usats.has(num)) num++;
    const vell = vells[idx] || {};
    const tr = { id: 'T' + Date.now().toString(36) + idx + Math.floor(rand() * 1e4), num, extra: [], data: vell.data || '', hora: vell.hora || '', aula: vell.aula || '', bloq: false };
    usats.add(num);
    S.tribunals.push(tr);
    g.forEach(t => { t.tribunal = tr.id; });
  });
  S.tribunals.sort((a, b) => a.num - b.num);
  completaMembres(S);
  return mc;
}

/* Si un tribunal no arriba a la mida (menys tutors diferents que places),
   hi afegeix professorat del pool, el més afí i amb menys tribunals. */
function completaMembres(S, nomesTr) {
  const mida = midaT(S);
  for (const tr of S.tribunals) {
    if (nomesTr && tr.id !== nomesTr) continue;
    tr.extra = tr.extra || [];
    const ws = treballsDe(S, tr);
    if (!ws.length) continue;
    while (membresTrib(S, tr).length < mida) {
      const c = carregues(S), mem = membresTrib(S, tr);
      let best = null, bs = Infinity;
      for (const k of poolKeys(S)) {
        if (mem.includes(k)) continue;
        const s = ws.reduce((a, w) => a + COST_TIER[tier(S, k, w.ambit)], 0) + c[k].tribunals.length * 8;
        if (s < bs) { bs = s; best = k; }
      }
      if (!best) break;
      tr.extra.push(best);
    }
  }
}

function solapa(a, b) { return a.data && a.hora && a.data === b.data && a.hora === b.hora; }

function incidencies(S) {
  const out = [], mida = midaT(S);
  const nom = k => (S.teachers[k] ? S.teachers[k].nom : k);
  const al = t => `${t.cognoms}, ${t.nom}`;
  for (const t of actius(S)) {
    if (!t.tutors.length) out.push({ niv: 'crit', t: t.id, msg: `${al(t)}: no té tutor/a assignat.` });
    if (!t.ambit) out.push({ niv: 'crit', t: t.id, msg: `${al(t)}: falta l'àmbit (departament) del treball.` });
    if (preparat(t) && !t.tribunal) out.push({ niv: 'crit', t: t.id, msg: `${al(t)}: no està en cap tribunal.` });
    if (t.tribunal) {
      const no = avaluadors(S, t).filter(a => a.tier === 2);
      if (no.length) out.push({ niv: 'avis', t: t.id, msg: `${al(t)} (${t.ambit}): ${no.map(a => nom(a.k)).join(', ')} ${no.length > 1 ? 'no són' : 'no és'} de departaments afins.` });
    }
    if (!t.titol && t.tutors.length) out.push({ niv: 'info', t: t.id, msg: `${al(t)}: no hi ha títol.` });
    if (t.ambitDeduit) out.push({ niv: 'info', t: t.id, msg: `${al(t)}: àmbit deduït del departament del tutor/a (${t.ambit}). Revisa'l.` });
    for (const k of t.tutors) if (S.teachers[k] && S.teachers[k].foraOrg) out.push({ niv: 'info', t: t.id, msg: `${al(t)}: ${nom(k)} no surt a l'organigrama; departament provisional ${S.teachers[k].depts[0]}.` });
  }
  for (const tr of S.tribunals) {
    const ws = treballsDe(S, tr), mem = membresTrib(S, tr), r = rolsTrib(S, tr);
    if (!ws.length) { out.push({ niv: 'info', tr: tr.id, msg: `Tribunal ${tr.num}: no té cap treball.` }); continue; }
    if (mem.length < mida) out.push({ niv: 'crit', tr: tr.id, msg: `Tribunal ${tr.num}: només té ${mem.length} membres (cal ${mida}).` });
    if (ws.length > mida) out.push({ niv: 'avis', tr: tr.id, msg: `Tribunal ${tr.num}: avalua ${ws.length} treballs (previst ${mida}).` });
    for (const k in r) if (r[k].length > 1) out.push({ niv: 'info', tr: tr.id, msg: `Tribunal ${tr.num}: ${nom(k)} hi té ${r[k].length} alumnes tutoritzats.` });
  }
  const trs = S.tribunals;
  for (let i = 0; i < trs.length; i++) for (let j = i + 1; j < trs.length; j++) {
    if (!solapa(trs[i], trs[j])) continue;
    const mj = membresTrib(S, trs[j]);
    for (const k of membresTrib(S, trs[i]).filter(x => mj.includes(x)))
      out.push({ niv: 'crit', tr: trs[i].id, msg: `${nom(k)} és als tribunals ${trs[i].num} i ${trs[j].num} el mateix dia i hora (${trs[i].data} ${trs[i].hora}).` });
  }
  return out;
}

const CAPS = {

function _files(f, nom) {
  const v = (f && f[nom]) || [];
  if (!v.length) return [];
  const cap = v[0].map(x => String(x).trim());
  return v.slice(1).filter(r => r.some(c => String(c).trim() !== '')).map(r => {
    const o = {}; cap.forEach((c, i) => { o[c] = r[i] == null ? '' : String(r[i]).trim(); }); return o;
  });
}
const _si = v => /^(s[ií]|si|x|true|1|yes)$/i.test(String(v || '').trim());
function normData(v) {
  v = String(v || '').trim(); if (!v) return '';
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/); if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  return v;
}
function normHora(v) {
  v = String(v || '').trim(); const m = v.match(/^(\d{1,2})[:.h](\d{2})/); return m ? `${m[1].padStart(2, '0')}:${m[2]}` : v;
}

function estatDesDeFulls(f) {
  const cfg = {}; _files(f, 'Config').forEach(r => { if (r.Clau) cfg[r.Clau] = r.Valor; });
  const json = (s, d) => { try { return s ? JSON.parse(s) : d; } catch (e) { return d; } };
  const S = {
    v: 3, curs: cfg.curs || 'Curs 2026-2027', savedAt: null,
    config: { midaTribunal: parseInt(cfg.midaTribunal, 10) || 4, afinitats: json(cfg.afinitats, null) || JSON.parse(JSON.stringify(AFINITATS_DEFECTE)) },
    correu: json(cfg.correu, {}), teachers: {}, treballs: [], tribunals: [], enviaments: {}
  };
  for (const r of _files(f, 'Professorat')) {
    if (!r.Nom) continue;
    const depts = r.Departament.split('/').map(x => x.trim()).filter(Boolean);
    S.teachers[r.Nom] = { nom: r.Nom, depts: depts.length ? depts : ['Experimentals'], email: r.Correu, pool: !/^no$/i.test(r.Disponible), cap: _si(r['Cap de departament']) ? [depts[0]] : [],
      foraOrg: /organigrama/i.test(r.Observacions), afegit: /afegit/i.test(r.Observacions), obs: r.Observacions };
  }

    const n = normTxt(nom), k = Object.keys(S.teachers).find(x => normTxt(x) === n);

  };
  const trNums = new Set();
  for (const r of _files(f, 'Tribunals')) {
    const n = parseInt(r.Tribunal, 10); if (!n || trNums.has(n)) continue; trNums.add(n);
    S.tribunals.push({ id: 'T' + n, num: n, data: normData(r.Data), hora: normHora(r.Hora), aula: r.Aula, bloq: _si(r.Bloquejat),
      extra: r['Membres afegits'].split(/[;\n]/).map(x => prof(x)).filter(Boolean) });
  }
  let i = 0;

    const estat = Object.keys(ESTATS).find(k => normTxt(ESTATS[k]) === normTxt(r.Estat)) || (/fet/i.test(r.Estat) ? 'fet' : /baixa/i.test(r.Estat) ? 'baixa' : 'actiu');
    const ambit = DEPTS.find(d => normTxt(d) === normTxt(r['Àmbit'])) || r['Àmbit'];
    const tutors = [prof(r['Tutor/a'], ambit), prof(r['Cotutor/a'], ambit)].filter(Boolean);
    const n = parseInt(r.Tribunal, 10);
    if (n && !trNums.has(n)) { trNums.add(n); S.tribunals.push({ id: 'T' + n, num: n, data: '', hora: '', aula: '', bloq: false, extra: [] }); }
    S.treballs.push({ id: r.ID || 'a' + i, cognoms: r.Cognoms, nom: r.Nom, grup: r.Grup, titol: r['Títol'], descripcio: r['Descripció'], nota: r.Nota,

  for (const r of _files(f, 'Enviaments')) {

    S.enviaments[k] = { tipus: /esborrany/i.test(r.Tipus) ? 'esborrany' : 'enviat', quan: r.Data, empremta: r.Empremta };

}

function fullsDesDeEstat(S) {
  const nom = k => (S.teachers[k] ? S.teachers[k].nom : k);

  out.Professorat = [CAPS.Professorat, ...ks.map(k => {

  for (const f in out) out[f] = out[f].map(r => r.map(c => c == null ? '' : String(c)));
  return out;
}

async function desa() {
  if (!artifactCap) return;
  const estat = JSON.parse(JSON.stringify(S));
  estat.savedAt = new Date().toISOString();
  const btn = $('#b-desa'); if (btn) { btn.disabled = true; btn.textContent = 'Desant…'; }
  try {
    esborraEsborrany();
    await artifactCap.publish(documentComplet(estat));
    UI.dirty = false; S.savedAt = estat.savedAt; renderCap();
    toast('Desat. Tothom qui obri l\'enllaç veurà aquesta versió.');
  } catch (e) {
    desaEsborrany();
    const c = e && e.code;
    if (c === 'conflict') toast('Una altra persona ha desat abans. La pàgina es recarrega amb la seva versió.');
    else if (c === 'not_granted' || c === 'not_writer') toast('Només tens permís de lectura. Descarrega una còpia de seguretat des de Configuració.');
    else toast('No s\'ha pogut desar (' + (c || 'error') + '). Torna-ho a provar.');
    renderCap();
  }
}
async function descarrega(filename, data) {
  if (!downloadsCap) { toast('Aquesta vista no permet descàrregues. Fes servir «Copia per a Excel».'); return; }
  try { await downloadsCap.save({ filename, data }); }
  catch (e) { if (e && e.code !== 'declined') toast('No s\'ha pogut descarregar (' + (e.code || 'error') + ').'); }
}

/* ---- Derivats ---- */
function incPerTrib(inc, tr) {
  const ids = new Set(treballsDe(S, tr).map(t => t.id));
  return inc.filter(i => i.tr === tr.id || (i.t && ids.has(i.t)));
}
function nivell(llista) { return llista.some(i => i.niv === 'crit') ? 'crit' : llista.some(i => i.niv === 'avis') ? 'avis' : ''; }
function ambitsTrib(tr) {
  const c = {}; treballsDe(S, tr).forEach(t => { if (t.ambit) c[t.ambit] = (c[t.ambit] || 0) + 1; });
  return Object.keys(c).sort((a, b) => c[b] - c[a]).map(a => chip(a, c[a])).join(' ');
}
function profsOrdenats(keys) { return keys.slice().sort((a, b) => nomP(a).localeCompare(nomP(b), 'ca')); }
function tribsDe(k) { return S.tribunals.filter(tr => membresTrib(S, tr).includes(k)); }
function ambits() { return [...new Set(S.treballs.map(t => t.ambit).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ca')); }
function resumAfinitat(t) {
  const av = avaluadors(S, t);
  if (!t.tribunal) return '';
  const n = [0, 0, 0]; av.forEach(a => n[a.tier]++);
  const parts = [];
  if (n[0]) parts.push(`<span class="pill ok">${n[0]} mateix dept.</span>`);
  if (n[1]) parts.push(`<span class="pill info">${n[1]} afí${n[1] > 1 ? 'ns' : ''}</span>`);
  if (n[2]) parts.push(`<span class="pill avis">${n[2]} no afí${n[2] > 1 ? 'ns' : ''}</span>`);
  return parts.join(' ');
}

function normTxt(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function coincideixTr(tr, inc) {
  const ws = treballsDe(S, tr);

    if (!txt.includes(q)) return false;
  }
  return true;
}

function filesAlumnes() {
  const out = [];
  for (const tr of S.tribunals) for (const t of treballsDe(S, tr)) out.push({
    Tribunal: tr.num, Data: tr.data, Hora: tr.hora, Aula: tr.aula, Alumne: alumne(t), Grup: t.grup, 'Títol': t.titol, 'Àmbit': t.ambit,
    'Tutor/a': t.tutors.map(nomP).join(' / '), 'Altres membres del tribunal': membresTrib(S, tr).filter(k => !t.tutors.includes(k)).map(nomP).join(', ')
  });
  return out;
}
function filesTribunals() {
  return S.tribunals.filter(tr => treballsDe(S, tr).length).map(tr => {
    const mem = membresTrib(S, tr), r = { Tribunal: tr.num, Data: tr.data, Hora: tr.hora, Aula: tr.aula };
    for (let i = 0; i < Math.max(midaT(S), mem.length); i++) r['Membre ' + (i + 1)] = mem[i] ? `${nomP(mem[i])} (${dept0(mem[i])})` : '';
    treballsDe(S, tr).forEach((t, i) => { r['Alumne ' + (i + 1)] = `${alumne(t)} (${t.grup})`; });
    return r;
  });
}
function filesProfessor() {
  const out = [];
  for (const k of profsOrdenats(Object.keys(S.teachers))) for (const tr of tribsDe(k).sort((a, b) => a.num - b.num)) {
    const meus = treballsDe(S, tr).filter(t => t.tutors.includes(k));
    out.push({ 'Professor/a': nomP(k), Departament: deptP(k), Tribunal: tr.num, Data: tr.data, Hora: tr.hora, Aula: tr.aula, 'Els seus alumnes': meus.map(alumne).join('; ') || '(membre afegit)', 'Treballs que avalua': treballsDe(S, tr).length });
  }
  return out;
}
function tsv(rows) {
  if (!rows.length) return '';
  const cols = [...new Set(rows.flatMap(r => Object.keys(r)))];
  return [cols.join('\t'), ...rows.map(r => cols.map(c => String(r[c] == null ? '' : r[c]).replace(/[\t\n]/g, ' ')).join('\t'))].join('\n');
}
function ampleCols(rows) {
  const cols = [...new Set(rows.flatMap(r => Object.keys(r)))];
  return cols.map(c => ({ wch: Math.min(60, Math.max(c.length, ...rows.map(r => String(r[c] == null ? '' : r[c]).length)) + 2) }));
}
async function exportaXlsx() {
  if (typeof XLSX === 'undefined') { toast('No s\'ha pogut carregar el generador d\'Excel. Fes servir «Copia per a Excel».'); return; }
  const wb = XLSX.utils.book_new();
  const fulls = [['Tribunals', filesTribunals()], ['Alumnes', filesAlumnes()], ['Professorat', filesProfessor()], ['Incidències', incidencies(S).map(i => ({ Nivell: i.niv, 'Incidència': i.msg }))]];
  for (const [nom, rows] of fulls) {
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ '': '' }]);
    if (rows.length) ws['!cols'] = ampleCols(rows);
    XLSX.utils.book_append_sheet(wb, ws, nom);
  }
  const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  await descarrega('tribunals-treball-recerca.xlsx', new Blob([buf]));
}
async function exportaHtml() {
  let cos, titol;
  if (UI.inf === 'professor') { titol = 'Tribunals per professor/a'; cos = informeProfessor(profsInforme()); }
  else if (UI.inf === 'departament') { titol = 'Resum per departament'; cos = informeDepts(); }

  else { titol = 'Tribunals del Treball de Recerca'; cos = informeFitxes(S.tribunals.filter(tr => treballsDe(S, tr).length)); }
  const css = APP_CSS + `\n@media print { .prof, .fitxa { break-inside: avoid; } body { background: #fff; } .taula-w { overflow: visible; } th { position: static; } .fitxes { grid-template-columns: 1fr 1fr; } }\n body{padding:20px} .linkbtn{pointer-events:none}`;
  const doc = `<!DOCTYPE html><html lang="ca" data-theme="light"><head><meta charset="utf-8"><title>${esc(titol)}</title><style>${css}</style></head><body><h1>${esc(titol)}</h1><p class="estat-desa">Treball de Recerca · ${esc(S.curs || 'Curs 2026-2027')} · generat el ${new Date().toLocaleDateString('ca-ES')}</p>${cos}</body></html>`;
  await descarrega(normTxt(titol).replace(/[^a-z0-9]+/g, '-') + '.html', doc);
}
async function copia() {
  let rows;
  if (UI.inf === 'professor') rows = filesProfessor().filter(r => !UI.infProf || r['Professor/a'] === nomP(UI.infProf));

const VERD = [23, 105, 90];
function pdfTxt(s) {

}
function pdfDisponible() { return !!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable); }
function nouPdf(titol) {

function capPdf(doc, titol, sub) {

}

function blocTribunalPdf(doc, tr, y, kDestacat) {

function errorGmail(e) {
  const c = e && e.code;
  if (c === 'server_not_connected' || c === 'selection_required') return { atura: true, msg: 'Gmail no està connectat. Afegeix-lo a claude.ai › Configuració › Connectors i torna-ho a provar.' };
  if (c === 'needs_reauth') return { atura: true, msg: 'Cal tornar a connectar Gmail a claude.ai › Configuració › Connectors.' };
  if (c === 'approval_required' || c === 'not_in_manifest' || c === 'consent_required') return { atura: true, msg: 'Cal que permetis que aquesta eina faci servir Gmail. Torna-ho a provar i accepta el permís.' };
  if (c === 'blocked_by_policy') return { atura: true, msg: 'La teva organització no permet enviar correus des d\'aquí.' };
  if (c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return { atura: true, msg: 'Aquesta vista no pot fer servir Gmail. Obre l\'eina a claude.ai.' };
  if (c === 'server_unavailable' || c === 'upstream_error' || c === 'cancelled') return { atura: true, dubte: true, msg: 'Gmail no ha respost. Comprova a Gmail si el correu ha sortit abans de tornar-lo a enviar.' };
  return { atura: false, msg: (e && e.message) || 'Error desconegut' };
}

async function enviaCorreus(tipus) {
  if (!mcpCap || enviant) return;
  const ks = destinataris().filter(k => SEL.has(k) && RE_MAIL.test(S.teachers[k].email || ''));
  if (!ks.length) return;
  const ja = ks.filter(k => S.enviaments[k] && S.enviaments[k].tipus === 'enviat' && S.enviaments[k].empremta === empremta(k)).length;
  const ok = await dialeg(tipus === 'enviat' ? 'Enviar els correus' : 'Crear esborranys',
    (tipus === 'enviat' ? `S'enviaran ${ks.length} correus des del teu Gmail, un per professor/a.` : `Es crearan ${ks.length} esborranys a la teva safata de Gmail perquè els revisis i els enviïs tu.`) + (ja ? ` ${ja} d'aquestes persones ja havien rebut aquest mateix tribunal.` : ''),
    [{ txt: 'Cancel·la', v: false }, { txt: tipus === 'enviat' ? 'Envia\'ls' : 'Crea els esborranys', v: true, pri: true }]);
  if (!ok) return;
  if (S.correu.adjunta && !pdfDisponible()) { toast('No s\'ha carregat el generador de PDF: desmarca «Adjunta el seu PDF» o recarrega la pàgina.'); return; }
  enviant = true; render();
  const C = S.correu, cc = C.cc.split(/[,;\s]+/).filter(x => RE_MAIL.test(x));
  let fets = 0, errors = [];
  for (const k of ks) {
    const p = $('#cr-progres'); if (p) p.textContent = `${tipus === 'enviat' ? 'Enviant' : 'Creant'} ${fets + 1} de ${ks.length}…`;
    const c = correuDe(k);
    const input = { to: [S.teachers[k].email.trim()], subject: c.assumpte, htmlBody: c.html, body: c.txt, includeSignature: !!C.signatura };
    if (cc.length) input.cc = cc;
    if (C.adjunta) {
      const b64 = pdfProfessors([k]).output('datauristring').split(',')[1];
      input.attachments = [{ content: b64, filename: 'tribunal-trec-' + normTxt(nomP(k)).replace(/[^a-z0-9]+/g, '-') + '.pdf', mimeType: 'application/pdf' }];
    }
    try {
      await mcpCap.callTool('Gmail', tipus === 'enviat' ? 'send_message' : 'create_draft', input);
      S.enviaments[k] = { tipus, quan: new Date().toISOString(), empremta: empremta(k) };
      fets++; UI.dirty = true; desaEsborrany();
    } catch (e) {
      const er = errorGmail(e);
      errors.push(nomP(k) + ': ' + er.msg);
      if (er.atura) { toast(er.msg); break; }
    }
  }
  enviant = false; render();
  if (fets) toast(`${fets} ${tipus === 'enviat' ? 'correus enviats' : 'esborranys creats'}${errors.length ? `; ${errors.length} amb error` : ''}. Desa per guardar-ne l'estat.`);
  else if (errors.length && !errorGmail({}).atura) toast(errors[0]);
}

function importaLlista(txt) {
  const ds = Object.keys(S.teachers);
  let ok = 0, no = [];
  for (const linia of txt.split(/\r?\n/)) {
    const m = linia.match(/[^\s@,;<>"']+@[^\s@,;<>"']+\.[a-z]{2,}/i);
    if (!m) continue;
    const nom = normTxt(linia.replace(m[0], ' ')).replace(/[^a-z ]/g, ' ').split(/\s+/).filter(w => w.length > 1);
    if (!nom.length) { no.push(m[0]); continue; }
    let best = null, bs = 0;
    for (const k of ds) {
      const tk = normTxt(nomP(k)).replace(/[^a-z ]/g, ' ').split(/\s+/).filter(w => w.length > 1);
      const comuns = nom.filter(w => tk.includes(w)).length;
      const s = comuns / Math.max(2, Math.min(tk.length, nom.length));
      if (comuns >= 2 || (comuns === 1 && tk.length === 1)) { if (s > bs) { bs = s; best = k; } }
    }
    if (best) { S.teachers[best].email = m[0]; ok++; } else no.push(linia.trim());
  }
  return { ok, no };
}

  if (el.dataset.email !== undefined && el.dataset.email) { const k = el.dataset.email; return muta(() => { S.teachers[k].email = el.value.trim(); }); }
  if (el.dataset.crsel) { el.checked ? SEL.add(el.dataset.crsel) : SEL.delete(el.dataset.crsel); return render(); }
  if (el.id === 'cr-tots') { destinataris().forEach(k => el.checked ? SEL.add(k) : SEL.delete(k)); return render(); }
  const camps = { 'cr-assumpte': 'assumpte', 'cr-intro': 'intro', 'cr-tancament': 'tancament', 'cr-cc': 'cc', 'cr-patro': 'patro' };
  if (camps[el.id]) return muta(() => { S.correu[camps[el.id]] = el.value; });
  if (el.id === 'cr-sig') return muta(() => { S.correu.signatura = el.checked; });
  if (el.id === 'cr-adj') return muta(() => { S.correu.adjunta = el.checked; });
});


/* ===== Mode Google Sheets: Apps Script (google.script.run) o GitHub Pages (fetch amb clau) ===== */
const CFG_KEY = 'trec-tribunals-connexio';
function llegeixCfg() { try { return JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch (e) { return null; } }
function desaCfg(c) { try { c ? localStorage.setItem(CFG_KEY, JSON.stringify(c)) : localStorage.removeItem(CFG_KEY); } catch (e) { } }
const esAppsScript = () => typeof google !== 'undefined' && google.script && google.script.run;

function api(accio, ...args) {
  const cfg = llegeixCfg();
  if (!cfg || !cfg.clau) return Promise.reject({ code: 'sense_connexio', message: 'Falta la clau d\'accés' });
  if (MODE === 'apps') {
    const n = { llegeix: 0, desa: 2, correu: 2 }[accio];
    const a = args.slice(); while (a.length < n) a.push(null); a.push(cfg.clau);
    return new Promise((res, rej) => {
      google.script.run.withSuccessHandler(res).withFailureHandler(e => rej({ code: 'tool_error', message: String((e && e.message) || e) }))[accio](...a);
    });
  }
  const cos = { accio, clau: cfg.clau };
  if (accio === 'desa') { cos.fulls = args[0]; cos.versio = args[1]; }
  if (accio === 'correu') { cos.missatge = args[0]; cos.esborrany = args[1]; }
  return fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(cos), redirect: 'follow' })
    .then(r => r.json())
    .catch(e => { throw { code: 'xarxa', message: 'No s\'ha pogut contactar amb el Google Sheets. Revisa l\'URL i que l\'aplicació web sigui accessible.' }; });
}

function aplicaLectura(r) {
  S = estatDesDeFulls(r.fulls);
  S.savedAt = r.versio || null;
  normalitza();
  BASE_NORM = JSON.stringify(S);
  UI.compte = r.compte || UI.compte; if (r.quota != null) UI.quota = r.quota;
  UI.undo = []; UI.dirty = false; UI.proposta = false;
  if (!S.tribunals.length && S.treballs.some(preparat)) { proposa(S, { seed: 2026 }); UI.proposta = true; UI.dirty = true; }
}

async function carrega() {
  $('#main').innerHTML = '<div class="wrap"><div class="buit-txt">Llegint el Google Sheets…</div></div>';
  try {
    const r = await api('llegeix');
    if (!r || !r.ok) throw { code: r && r.error === 'clau' ? 'clau' : 'tool_error', message: r ? r.error : 'Resposta buida' };
    aplicaLectura(r);
    UI.esborrany = llegeixEsborrany();
    ruta();
  } catch (e) {
    if (e.code === 'clau' || e.code === 'sense_connexio' || (MODE === 'web' && e.code === 'xarxa')) return pantallaConnexio(e.code === 'clau' ? 'La clau no és correcta.' : e.code === 'xarxa' ? e.message : '');
    $('#cap').innerHTML = ''; $('#main').innerHTML = `<div class="wrap"><div class="panell"><h2>No s'ha pogut llegir el full</h2><p>${esc(e.message || e)}</p><div class="row"><button class="btn pri" id="b-reintenta">Torna-ho a provar</button></div></div></div>`;
  }
}

function pantallaConnexio(error) {
  const c = llegeixCfg() || {};
  $('#cap').innerHTML = `<header class="top"><div class="wrap"><div class="titol"><h1>Tribunals del Treball de Recerca</h1><div class="sub">Connecta l'eina amb el Google Sheets del centre</div></div></div></header>`;
  $('#main').innerHTML = `<div class="wrap" style="margin-top:20px"><div class="panell" style="max-width:640px">
    <h2>Connexió amb el Google Sheets</h2>
    <p>${MODE === 'web' ? 'Enganxa l\'URL de l\'aplicació web d\'Apps Script (acaba en <code>/exec</code>) i la' : 'Escriu la'} clau que surt al menú <b>Tribunals TREC › Mostra la clau d'accés</b> del Google Sheets. Es guarda només en aquest navegador.</p>
    ${error ? `<div class="banner warn"><span>${esc(error)}</span></div>` : ''}
    ${MODE === 'web' ? `<label class="field">URL de l'aplicació web<input id="cx-url" value="${esc(c.url || '')}" placeholder="https://script.google.com/macros/s/…/exec"></label>` : ''}
    <label class="field">Clau d'accés<input id="cx-clau" value="${esc(c.clau || '')}" type="password" autocomplete="off"></label>
    <div class="row"><button class="btn pri" id="cx-connecta">Connecta</button></div>
  </div></div>`;
}

async function desa(forca) {
  const btn = $('#b-desa'); if (btn) { btn.disabled = true; btn.textContent = 'Desant…'; }
  try {
    const r = await api('desa', fullsDesDeEstat(S), forca ? null : S.savedAt);
    if (r && r.ok) {
      S.savedAt = r.versio; UI.dirty = false; BASE_NORM = JSON.stringify(S); esborraEsborrany(); renderCap();
      toast('Desat al Google Sheets.');
      return;
    }
    if (r && r.error === 'conflicte') {
      renderCap();
      const q = await dialeg('El full ha canviat', 'Algú ha editat el Google Sheets o ha desat des d\'una altra pantalla després que l\'obrissis. Pots recarregar-lo (perds els canvis d\'aquí) o sobreescriure\'l amb la teva versió.',
        [{ txt: 'Cancel·la', v: null }, { txt: 'Recarrega el full', v: 'r' }, { txt: 'Sobreescriu', v: 'w', pri: true }]);
      if (q === 'w') return desa(true);
      if (q === 'r') { esborraEsborrany(); return carrega(); }
      return;
    }
    throw { message: r ? r.error : 'Resposta buida' };
  } catch (e) {
    desaEsborrany(); renderCap();
    toast('No s\'ha pogut desar: ' + (e.message || e) + '. Els canvis es queden en aquest navegador.');
  }
}

/* Adaptadors perquè la resta de l'eina funcioni igual que a claude.ai */
function activaAdaptadors() {
  downloadsCap = {
    save: async ({ filename, data }) => {
      const blob = data instanceof Blob ? data : new Blob([data], { type: /\.html$/.test(filename) ? 'text/html' : /\.json$/.test(filename) ? 'application/json' : 'application/octet-stream' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      return { status: 'saved' };
    }
  };
  mcpCap = {
    callTool: async (server, tool, input) => {
      const m = { to: input.to, cc: input.cc || [], assumpte: input.subject, html: input.htmlBody, text: input.body,
        adjunts: (input.attachments || []).map(a => ({ nom: a.filename, b64: a.content, tipus: a.mimeType })) };
      let r;
      try { r = await api('correu', m, tool === 'create_draft'); }
      catch (e) { throw { code: e.code === 'xarxa' ? 'server_unavailable' : 'tool_error', message: e.message }; }
      if (!r || !r.ok) throw { code: 'tool_error', message: (r && r.error) || 'Error desconegut' };
      if (r.quota != null) UI.quota = r.quota;
      return { payload: r };
    }
  };
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'b-recarrega') {
    if (UI.dirty) {
      const ok = await dialeg('Recarregar el full', 'Tens canvis sense desar. Si recarregues, es perdran.', [{ txt: 'Cancel·la', v: false }, { txt: 'Recarrega', v: true, pri: true }]);
      if (!ok) return;
    }
    esborraEsborrany(); return carrega();
  }
  if (b.id === 'b-reintenta') return carrega();
  if (b.id === 'cx-connecta') {
    const url = MODE === 'web' ? $('#cx-url').value.trim() : '', clau = $('#cx-clau').value.trim();
    if (!clau) return pantallaConnexio('Escriu la clau.');
    if (MODE === 'web' && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) return pantallaConnexio('L\'URL ha de ser la de l\'aplicació web d\'Apps Script (script.google.com/…/exec).');
    desaCfg({ url, clau }); return carrega();
  }
  if (b.id === 'cx-desconnecta') { desaCfg(null); return pantallaConnexio(''); }
});

/* ---- Arrencada ---- */
$('#app').innerHTML = '<div id="cap"></div><main id="main"></main>';
MODE = esAppsScript() ? 'apps' : 'web';
activaAdaptadors();
artifactCap = null;
if (!llegeixCfg()) pantallaConnexio('');
else carrega();
</script>
